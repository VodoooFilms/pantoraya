<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'">
  <title>Pantoraya</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window-drag-region" aria-hidden="true"></div>
  <main class="shell">
    <header class="masthead">
      <span class="brand">
        <img class="brand-icon" src="../../assets/icons/pantoraya-mark.png" alt="" aria-hidden="true">
        <span>Pantoraya</span>
      </span>
      <nav class="converter-tabs" id="converterTabs" role="tablist" aria-label="Tipo de conversión">
        <button class="converter-tab active" id="mp4Tab" data-converter="mp4" role="tab" aria-selected="true">MP4</button>
        <button class="converter-tab" id="mp3Tab" data-converter="mp3" role="tab" aria-selected="false" tabindex="-1">MP3</button>
        <button class="converter-tab" id="pdfTab" data-converter="pdf" role="tab" aria-selected="false" tabindex="-1">PDF</button>
        <button class="converter-tab pdf-pro-tab" id="pdfProTab" data-converter="pdfpro" role="tab" aria-selected="false" tabindex="-1">PDF PRO</button>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">
        <svg class="sun-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="3.2"></circle>
          <path d="M10 2v1.5M10 16.5V18M2 10h1.5M16.5 10H18M4.3 4.3l1.1 1.1M14.6 14.6l1.1 1.1M15.7 4.3l-1.1 1.1M5.4 14.6l-1.1 1.1"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M16.2 12.8A6.7 6.7 0 0 1 7.2 3.8a6.7 6.7 0 1 0 9 9Z"></path>
        </svg>
      </button>
      <button class="language-toggle" id="languageToggle" aria-label="Cambiar a inglés" title="Cambiar a inglés">ES</button>
    </header>

    <section class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Seleccionar un video">
      <strong id="dropTitle">Arrastra un video</strong>
      <span id="dropHint">o haz clic para abrir</span>
    </section>

    <section class="file-card hidden" id="fileCard">
      <img class="file-thumbnail hidden" id="fileThumbnail" alt="">
      <div class="file-mark" id="fileMark" data-format="MP4" aria-hidden="true"></div>
      <div class="file-copy">
        <strong id="fileName"></strong>
      </div>
      <div class="file-size"><small id="originalLabel">Original</small><strong id="fileSize"></strong></div>
      <button class="icon-button" id="removeButton" aria-label="Quitar video">×</button>
    </section>

    <section class="subtitle-picker hidden" id="subtitlePicker" tabindex="0" role="button" aria-label="Añadir subtítulos SRT opcionales">
      <span class="subtitle-label" id="subtitleLabel">+ Añadir subtítulos SRT <small>(opcional)</small></span>
      <span class="subtitle-file hidden" id="subtitleFile"></span>
      <button class="subtitle-remove hidden" id="subtitleRemove" aria-label="Quitar subtítulos">×</button>
    </section>

    <section class="profiles" id="profilesSection" aria-label="Calidad del video">
      <div class="profile-grid" id="profileGrid"></div>
    </section>

    <section class="progress hidden" id="progressPanel" aria-live="polite">
      <div class="progress-copy"><strong id="progressLabel">Preparando…</strong><span id="progressPercent">0%</span></div>
      <div class="track"><div id="progressBar"></div></div>
      <span id="progressTime"></span>
    </section>

    <section class="result hidden" id="resultPanel" aria-live="polite">
      <span class="check">✓</span>
      <div><strong id="resultTitle">Listo</strong><span id="resultDetails"></span></div>
    </section>

    <section class="pdf-result hidden" id="pdfResultPanel" aria-live="polite">
      <div class="pdf-result-title"><span class="check">✓</span><strong id="pdfResultTitle">Listo</strong></div>
      <div class="pdf-metrics">
        <div><small id="pdfOriginalLabel">Original</small><strong id="pdfOriginalSize"></strong></div>
        <div><small id="pdfCompressedLabel">Comprimido</small><strong id="pdfCompressedSize"></strong></div>
        <div><small id="pdfReductionLabel">Reducción</small><strong id="pdfReduction"></strong></div>
        <div><small id="pdfQualityLabel">Calidad estimada</small><strong id="pdfQuality"></strong></div>
      </div>
    </section>

    <p class="error hidden" id="errorMessage" role="alert"></p>

    <div class="actions">
      <button class="secondary hidden" id="cancelButton">Cancelar</button>
      <button class="secondary hidden" id="anotherButton">Comprimir otro PDF</button>
      <button class="primary" id="convertButton" disabled>Convertir a MP4</button>
      <button class="primary success hidden" id="revealButton">Mostrar en Finder</button>
    </div>

    <section class="pdf-pro hidden" id="pdfProSection" aria-label="PDF Pro">
      <div class="pdf-pro-empty" id="pdfProEmpty" tabindex="0" role="button">
        <strong id="pdfProEmptyTitle">Edita y organiza un PDF</strong>
        <span id="pdfProEmptyHint">abre un documento para comenzar</span>
      </div>

      <div class="pdf-pro-editor hidden" id="pdfProEditor">
        <div class="pdf-pro-document-bar">
          <div class="pdf-pro-document-name">
            <span class="pdf-pro-dirty hidden" id="pdfProDirty" aria-label="Cambios sin guardar"></span>
            <strong id="pdfProName"></strong>
            <button class="pdf-pro-icon pdf-pro-document-close" id="pdfProClose" title="Cerrar documento" aria-label="Cerrar documento">×</button>
          </div>
          <span id="pdfProCounter">Página 1 de 1</span>
          <button class="pdf-pro-icon" id="pdfProFullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
        </div>

        <div class="pdf-pro-workspace">
          <aside class="pdf-pro-sidebar" id="pdfProSidebar" aria-label="Páginas">
            <div class="pdf-pro-thumbnails" id="pdfProThumbnails" role="listbox" aria-multiselectable="true"></div>
          </aside>
          <div class="pdf-pro-preview" id="pdfProPreview">
            <div class="pdf-pro-canvas-wrap" id="pdfProCanvasWrap">
              <canvas id="pdfProCanvas" aria-label="Vista previa de la página"></canvas>
            </div>
            <div class="pdf-pro-zoom">
              <button id="pdfProPrevious" aria-label="Página anterior">‹</button>
              <button id="pdfProZoomOut" aria-label="Alejar">−</button>
              <span id="pdfProZoomValue">100%</span>
              <button id="pdfProZoomIn" aria-label="Acercar">+</button>
              <button id="pdfProNext" aria-label="Página siguiente">›</button>
            </div>
          </div>
        </div>

        <div class="pdf-pro-toolbar" aria-label="Acciones PDF">
          <button id="pdfProAdd">+ Añadir</button>
          <button id="pdfProReplace">Reemplazar</button>
          <button id="pdfProRotate">↻ Rotar</button>
          <button id="pdfProDelete">Eliminar</button>
          <button id="pdfProExtract">Extraer</button>
          <span class="pdf-pro-toolbar-spacer"></span>
          <button class="pdf-pro-icon" id="pdfProUndo" aria-label="Deshacer" title="Deshacer">↶</button>
          <button class="pdf-pro-icon" id="pdfProRedo" aria-label="Rehacer" title="Rehacer">↷</button>
          <button class="pdf-pro-save" id="pdfProSave">Guardar una copia</button>
        </div>

        <div class="pdf-pro-status hidden" id="pdfProStatus" aria-live="polite">
          <div class="track"><div id="pdfProProgressBar"></div></div>
          <span id="pdfProStatusText"></span>
          <button id="pdfProCancel">Cancelar</button>
        </div>
        <p class="pdf-pro-error hidden" id="pdfProError" role="alert"></p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script type="module" src="pdf-pro.js"></script>
</body>
</html>
