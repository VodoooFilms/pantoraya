name: Build and publish Linux package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-linux.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'assets/**'

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Build Debian package
        run: npm run build:linux
      - name: Upload Linux package to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" "dist/Pantoraya-$version-amd64.deb" --clobber
