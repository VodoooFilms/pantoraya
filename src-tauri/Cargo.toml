[package]
name = "pantoraya"
version = "1.3.0"
description = "Private, offline MP4, MP3, JPG converter for macOS, Windows and Linux"
authors = ["VodoooFilms"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "pantoraya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
